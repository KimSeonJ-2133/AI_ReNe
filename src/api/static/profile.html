<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReNe Profile - Bento Grid</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-radius: 1.5rem;
            --gap: 1.5rem;
        }

        * {
            box_sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* Bento Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(180px, auto);
            gap: var(--gap);
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Grid Spans */
        .col-span-1 { grid-column: span 1; }
        .col-span-2 { grid-column: span 2; }
        .col-span-3 { grid-column: span 3; }
        .col-span-4 { grid-column: span 4; }
        
        .row-span-1 { grid-row: span 1; }
        .row-span-2 { grid-row: span 2; }

        /* Specific Card Styles */
        
        /* Profile Card */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e5e7eb;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .profile-role {
            color: var(--primary-color);
            font-weight: 500;
        }

        /* Level Card */
        .level-card {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .level-number {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
        }
        .level-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        /* Skills Card */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .skill-tag {
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* List Items (Education, Career) */
        .list-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        .list-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Project Card */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            width: 100%;
        }
        .project-item {
            background-color: #f9fafb;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #e5e7eb;
        }
        .project-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .project-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .col-span-3, .col-span-4 {
                grid-column: span 2;
            }
        }

        @media (max-width: 640px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .col-span-1, .col-span-2, .col-span-3, .col-span-4 {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="margin-bottom: 2rem; font-weight: 800;">My Profile</h1>
        
        <div class="bento-grid" id="profile-grid">
            <!-- 1. Profile Main (2x2) -->
            <div class="card col-span-2 row-span-2 profile-card">
                <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img" id="p-img">
                <h2 class="profile-name" id="p-name">Loading...</h2>
                <p class="profile-role" id="p-email">...</p>
                <p style="margin-top: 1rem; color: var(--text-secondary);" id="p-intro">...</p>
            </div>

            <!-- 2. RCS Level (1x1) -->
            <div class="card col-span-1 row-span-1 level-card">
                <div class="level-number" id="p-rcs">?</div>
                <div class="level-label">RCS Level</div>
            </div>

            <!-- 3. NCS Level (1x1) -->
            <div class="card col-span-1 row-span-1 level-card" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                <div class="level-number" id="p-ncs">?</div>
                <div class="level-label">NCS Level</div>
            </div>

            <!-- 4. Badge / Talent Type (2x1) -->
            <div class="card col-span-2 row-span-1">
                <div class="card-header">🏅 인증 & 성향</div>
                <div style="display: flex; gap: 1rem; align-items: center; height: 100%;">
                    <div style="flex: 1; text-align: center;">
                        <div style="font-size: 2rem;" id="p-badge-icon">🌱</div>
                        <div style="font-weight: 600;" id="p-badge-text">Sprout</div>
                    </div>
                    <div style="width: 1px; height: 40px; background: #e5e7eb;"></div>
                    <div style="flex: 1; text-align: center;">
                        <div style="font-size: 1.2rem; font-weight: 700; color: #8b5cf6;" id="p-talent">Unknown</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">Talent Type</div>
                    </div>
                </div>
            </div>

            <!-- 5. Skills (2x2) -->
            <div class="card col-span-2 row-span-2">
                <div class="card-header">🛠️ Tech Stack</div>
                <div class="skills-container" id="p-skills">
                    <!-- Skills will be injected here -->
                </div>
            </div>

            <!-- 6. Education (2x1) -->
            <div class="card col-span-2 row-span-1">
                <div class="card-header">🎓 Education</div>
                <div id="p-education">
                    <!-- Education list -->
                </div>
            </div>

            <!-- 7. Career (2x2) -->
            <div class="card col-span-2 row-span-2">
                <div class="card-header">💼 Work Experience</div>
                <div id="p-career" style="overflow-y: auto;">
                    <!-- Career list -->
                </div>
            </div>

            <!-- 8. Projects (4x2) -->
            <div class="card col-span-4 row-span-2">
                <div class="card-header">🚀 Key Projects</div>
                <div class="project-grid" id="p-projects">
                    <!-- Projects grid -->
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchProfile() {
            // URL 파라미터에서 user_id 가져오기 (기본값 1)
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user_id') || 1;

            try {
                const response = await fetch(`/api/v1/jobseeker/profile/${userId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch profile');
                }
                const data = await response.json();
                renderProfile(data);
            } catch (error) {
                console.error('Error:', error);
                alert('프로필 정보를 불러오는데 실패했습니다.');
            }
        }

        function renderProfile(data) {
            // 1. Basic Info
            document.getElementById('p-name').textContent = data.name;
            document.getElementById('p-email').textContent = data.email;
            document.getElementById('p-intro').textContent = data.brief_introduction || "자기소개가 없습니다.";
            if (data.profile_image_url) {
                document.getElementById('p-img').src = data.profile_image_url;
            }

            // 2. Levels
            document.getElementById('p-rcs').textContent = data.rcs_level || '-';
            document.getElementById('p-ncs').textContent = data.ncs_level || '-';

            // 3. Badge & Talent
            document.getElementById('p-badge-text').textContent = data.verification_badge;
            document.getElementById('p-talent').textContent = data.talent_type || "Unclassified";

            // 4. Skills
            const skillsContainer = document.getElementById('p-skills');
            skillsContainer.innerHTML = '';
            if (data.main_skills && data.main_skills.length > 0) {
                data.main_skills.forEach(skill => {
                    const tag = document.createElement('div');
                    tag.className = 'skill-tag';
                    tag.textContent = skill;
                    skillsContainer.appendChild(tag);
                });
            } else {
                skillsContainer.innerHTML = '<p style="color: #9ca3af;">등록된 기술 스택이 없습니다.</p>';
            }

            // 5. Education
            const eduContainer = document.getElementById('p-education');
            eduContainer.innerHTML = '';
            if (data.education && data.education.length > 0) {
                data.education.forEach(edu => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    // 문자열로 올 수도 있고 객체로 올 수도 있음 (DTO 확인 필요)
                    // 현재 DTO는 List[str]로 정의됨
                    item.innerHTML = `<div class="list-title">${edu}</div>`;
                    eduContainer.appendChild(item);
                });
            } else {
                eduContainer.innerHTML = '<p style="color: #9ca3af;">학력 정보가 없습니다.</p>';
            }

            // 6. Career
            const careerContainer = document.getElementById('p-career');
            careerContainer.innerHTML = '';
            if (data.career && data.career.length > 0) {
                data.career.forEach(job => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    // Resume 파싱 구조에 따라 필드명이 다를 수 있음. 
                    // dummy data generator를 보면: company_name, period, role
                    const company = job.company_name || job.company || "Unknown Company";
                    const role = job.role || job.position || "Member";
                    const period = job.period || "";
                    
                    item.innerHTML = `
                        <div class="list-title">${company}</div>
                        <div class="list-subtitle">${role} | ${period}</div>
                    `;
                    careerContainer.appendChild(item);
                });
            } else {
                careerContainer.innerHTML = '<p style="color: #9ca3af;">경력 정보가 없습니다.</p>';
            }

            // 7. Projects
            const projectContainer = document.getElementById('p-projects');
            projectContainer.innerHTML = '';
            if (data.projects && data.projects.length > 0) {
                data.projects.forEach(proj => {
                    const item = document.createElement('div');
                    item.className = 'project-item';
                    
                    const title = proj.project_name || proj.name || "Untitled Project";
                    const desc = proj.description || proj.summary || "No description available.";
                    const role = proj.position || proj.role || "";

                    item.innerHTML = `
                        <div class="project-title">${title}</div>
                        <div style="font-size: 0.8rem; color: #3b82f6; margin-bottom: 0.5rem;">${role}</div>
                        <div class="project-desc">${desc}</div>
                    `;
                    projectContainer.appendChild(item);
                });
            } else {
                projectContainer.innerHTML = '<p style="color: #9ca3af;">등록된 프로젝트가 없습니다.</p>';
            }
        }

        // Init
        // async function 정의 시 오타 수정 (def -> function)
        fetchProfile();
        
        // Fix async function syntax error in script above
        // It was written as `async def fetchProfile` which is Python syntax, not JS.
        // Correcting it here via replacement logic is hard, so I will rewrite the script block correctly in the file creation.
    </script>
</body>
</html>
