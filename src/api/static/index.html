<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Voice Agent Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; }
        #status { margin-top: 20px; color: gray; }
        .box { border: 1px solid #ddd; padding: 20px; margin: 20px auto; max-width: 600px; border-radius: 8px;}
    </style>
</head>
<body>
    <h1>🎙️ AI 음성 에이전트 테스트</h1>
    
    <div class="box">
        <button id="recordBtn">🔴 녹음 시작</button>
        <button id="stopBtn" disabled>⬛ 녹음 종료 및 전송</button>
        <p id="status">대기 중...</p>
    </div>

    <div class="box" style="text-align: left;">
        <p><strong>🗣️ 내 질문:</strong> <span id="userText"></span></p>
        <hr>
        <p><strong>🤖 AI 응답:</strong> <span id="aiText"></span></p>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');

        recordBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); // webm, wav 등
                sendAudio(audioBlob);
                audioChunks = [];
            };

            mediaRecorder.start();
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            status.innerText = "녹음 중...";
            recordBtn.innerText = "녹음 중...";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "처리 중...";
            recordBtn.innerText = "🔴 녹음 시작";
        };

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            try {
                const response = await fetch('/api/voice-chat', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                document.getElementById('userText').innerText = data.user_text;
                document.getElementById('aiText').innerText = data.ai_response;
                status.innerText = "완료!";
            } catch (error) {
                console.error(error);
                status.innerText = "에러 발생!";
            }
        }
    </script>
</body>
</html>
