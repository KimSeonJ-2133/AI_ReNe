<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Voice Agent Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; }
        #status { margin-top: 20px; color: gray; font-weight: bold; }
        .box { border: 1px solid #ddd; padding: 20px; margin: 20px auto; max-width: 600px; border-radius: 8px; background-color: #f9f9f9; }
        .result-box { text-align: left; background-color: white; }
        
        /* 시간 표시용 스타일 추가 */
        .time-info {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            background: #eef;
            padding: 10px;
            border-radius: 5px;
        }
        .time-val { font-weight: bold; color: #d63384; }
    </style>
</head>
<body>
    <h1>🎙️ AI 음성 에이전트 테스트</h1>
    
    <div class="box">
        <button id="recordBtn">🔴 녹음 시작</button>
        <button id="stopBtn" disabled>⬛ 녹음 종료 및 전송</button>
        <p id="status">대기 중...</p>
        
        <div class="time-info">
            <span>⏱️ 녹음 시간: <span id="recordTime" class="time-val">0.00</span>초</span>
            <span>⚡ 응답 소요 시간: <span id="responseTime" class="time-val">-</span>초</span>
        </div>
    </div>

    <div class="box result-box">
        <p><strong>🗣️ 내 질문:</strong> <span id="userText" style="color: #333;"></span></p>
        <hr>
        <p><strong>🤖 AI 응답:</strong> <span id="aiText" style="color: #0056b3;"></span></p>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        
        // 시간 측정을 위한 변수
        let startRecordTime; // 녹음 시작 시각
        let startProcessTime; // 서버 전송 시작 시각

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const userText = document.getElementById('userText');
        const aiText = document.getElementById('aiText');
        
        const recordTimeDisplay = document.getElementById('recordTime');
        const responseTimeDisplay = document.getElementById('responseTime');

        recordBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                
                mediaRecorder.onstop = async () => {
                    // 1. 녹음 종료 시점 계산
                    const recordDuration = (Date.now() - startRecordTime) / 1000;
                    recordTimeDisplay.innerText = recordDuration.toFixed(2); // 소수점 2자리까지 표시

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
                    sendAudio(audioBlob);
                    audioChunks = []; 
                };

                mediaRecorder.start();
                
                // 2. 녹음 시작 시간 기록
                startRecordTime = Date.now();
                
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                status.innerText = "녹음 중... (말씀하세요)";
                status.style.color = "red";
                
                // UI 초기화
                userText.innerText = "";
                aiText.innerText = "";
                responseTimeDisplay.innerText = "-"; // 응답 시간 초기화

            } catch (err) {
                console.error("마이크 접근 실패:", err);
                status.innerText = "마이크 권한이 필요합니다.";
            }
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "처리 중... (잠시만 기다려주세요)";
            status.style.color = "blue";
        };

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            try {
                // 3. 서버 요청 시작 시간 기록
                startProcessTime = Date.now();

                const response = await fetch('/api/v1/rene/begin/voice-chat', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                // 4. 응답 도착 후 시간 계산
                const processDuration = (Date.now() - startProcessTime) / 1000;
                responseTimeDisplay.innerText = processDuration.toFixed(2); // 결과 표시

                if (response.ok) {
                    userText.innerText = result.data.user_text;
                    aiText.innerText = result.data.ai_response;
                    status.innerText = "완료! (" + result.message + ")";
                    status.style.color = "green";
                } else {
                    console.error("Server Error:", result);
                    status.innerText = "서버 에러: " + (result.detail || result.message || "알 수 없는 오류");
                    status.style.color = "red";
                }

            } catch (error) {
                console.error("Network Error:", error);
                status.innerText = "네트워크 통신 오류 발생!";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
